name: check
on: [push, pull_request]
env:
  # the core checkout the packages are validated against (change it when the core lives elsewhere)
  CORE_REPOSITORY: hobnix/server
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          path: core
      - name: Manifests and index
        run: |
          mkdir tree && ln -s "$PWD/recipes" "tree/packages"
          HS_PACKAGES_ROOT="$PWD/tree" python3 -I core/scripts/pkg.py validate
          python3 -I core/scripts/pkg.py repo-check .
      - name: Shell syntax
        run: for f in recipes/*/*.sh; do [ -f "$f" ] && bash -n "$f"; done; true
      - name: Tools the tests use
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq python3-pil
      - name: Tests (against the core checked out above)
        run: HS_CORE="$PWD/core" HS_TEST_CI=1 bash tests/run-all.sh
  # The release pull request (into main): a package whose folder changed since the last tag needs a higher version in package.toml AND index.toml.
  # The command comes from the core checkout (its default branch, develop), so this job works once hobnix/server has `pkg.py repo-unbumped`.
  versions:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          path: core
      - name: Packages changed without a version bump
        run: |
          tag=$(git describe --tags --abbrev=0 origin/main 2>/dev/null || true)
          if [ -z "$tag" ]; then echo "No tag on main yet: nothing to compare."; exit 0; fi
          echo "Last release: $tag"
          if ! python3 -I core/scripts/pkg.py repo-unbumped "$tag" .; then
            echo "These packages changed since $tag without a higher version in package.toml and index.toml. Raise it: bash <core>/scripts/dev/release.sh bump <package>"
            exit 1
          fi
