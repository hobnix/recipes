# Manifest of a package (docs/PLAN-packages.md). The header lines of run.sh say the same (tests/pkg.sh keeps both in step).
name = "navidrome"
version = "1.2.0"
kind = "recipe"
title = "streams your music library to phones and browsers (Subsonic apps work with it)"
title_de = "streamt deine Musikbibliothek auf Handy und Browser (Subsonic-Apps funktionieren damit)"
requires_core = ">=9"
audience = "generic"
needs = ["docker", "share"]
uses = []
input = "none"
script = "run.sh"
runs = ["lxc", "docker"]

description = "Streams your music library to phones and browsers."
description_de = "Streamt deine Musiksammlung auf Handys und Browser."
icon = "ph:music-notes"
category = "media"
upstream = "https://www.navidrome.org"
app_version = "latest"

[app]
instances = "one"
autostart = true

[app.health]
check = "http"
port = 4533
path = "/"
timeout = 5

[app.backup]
mode = "instance"
dump = "sqlite-tree"

[app.routes]
default = "web"
web = { port = 4533, scheme = "http", exposure = "public-ok" }

[app.update]
kind = "manual"
default = "notify"

[app.remove]
keeps = ["the media share (/media)"]
data = ["/opt/navidrome"]

[app.uses]
ram_mb = 1024
ports = [4533]
