# Manifest of a package (docs/PLAN-packages.md). Until the packages move out of this repository the header lines of the
# script still say the same (tests/pkg.sh keeps both in step).
name = "monitoring"
version = "1.1.0"
kind = "recipe"
title = "history of load, disks, pools, containers, and the server's logs"
title_de = "Verlauf von Last, Platten, Pools, Containern und die Logs des Servers"
requires_core = ">=9"
audience = "generic"
needs = []
uses = []
input = "none"
script = "run.sh"

description = "History of load, disks, pools and containers in Grafana, and the server's logs in Loki."
description_de = "Verlauf von Last, Platten, Pools und Containern in Grafana, dazu die Logs des Servers in Loki."
icon = "ph:chart-line"
category = "admin"
upstream = "https://grafana.com"
app_version = "latest"

[app]
instances = "one"
autostart = true

[app.health]
check = "http"
port = 3000
path = "/api/health"
timeout = 5

[app.backup]
mode = "instance"

[app.routes]
default = "web"
web = { port = 3000, scheme = "http", exposure = "never-public", admin = true }

[app.update]
kind = "os"
default = "notify"

[app.version]
source = "http-json"
path = "/api/health"
pointer = "/version"

[app.remove]
keeps = ["the history Prometheus keeps on the server"]
data = ["/var/lib/grafana", "/var/lib/loki"]
