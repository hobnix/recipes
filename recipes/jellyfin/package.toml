# Manifest of a package (docs/PLAN-packages.md). Until the packages move out of this repository the header lines of the
# script still say the same (tests/pkg.sh keeps both in step).
name = "jellyfin"
version = "1.2.0"
kind = "recipe"
title = "watch your films, series and music in the browser, on the TV and on the phone"
title_de = "Filme, Serien und Musik im Browser, auf dem Fernseher und auf dem Handy ansehen"
requires_core = ">=9"
audience = "generic"
needs = ["share"]
uses = ["gpu"]
input = "none"
script = "run.sh"

description = "Streams your films, series and music to TVs, phones and browsers."
description_de = "Streamt deine Filme, Serien und Musik auf Fernseher, Handys und Browser."
icon = "ph:film-slate"
category = "media"
upstream = "https://jellyfin.org"
app_version = "latest"

[app]
instances = "one"
autostart = true

[app.health]
check = "http"
port = 8096
path = "/health"
timeout = 5

[app.backup]
mode = "instance"

[app.routes]
default = "web"
web = { port = 8096, scheme = "http", exposure = "private-ok" }

[app.update]
kind = "os"
default = "notify"

[app.version]
source = "http-json"
path = "/System/Info/Public"
pointer = "/Version"

[app.remove]
keeps = ["the media share (read-only at /media)"]
data = ["/var/lib/jellyfin"]

[app.uses]
ram_mb = 4096
ports = [8096]
