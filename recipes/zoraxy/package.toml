# Manifest of a package (docs/PLAN-packages.md). Until the packages move out of this repository the header lines of the
# script still say the same (tests/pkg.sh keeps both in step).
name = "zoraxy"
version = "1.1.0"
kind = "recipe"
title = "the reverse proxy that sends each public name to the right container"
title_de = "der Reverse-Proxy, der jeden öffentlichen Namen zum richtigen Container schickt"
requires_core = ">=9"
audience = "personal"
needs = []
uses = []
input = "none"
script = "run.sh"

description = "The reverse proxy that sends each public name to the right container."
description_de = "Der Reverse-Proxy, der jeden öffentlichen Namen zum richtigen Container schickt."
icon = "ph:arrows-split"
category = "network"
upstream = "https://zoraxy.arozos.com"
app_version = "latest"

[app]
instances = "one"
autostart = true

[app.health]
check = "http"
port = 8000
path = "/"
timeout = 5

[app.backup]
mode = "instance"

[app.routes]
default = "admin"
admin = { port = 8000, scheme = "http", exposure = "never-public", admin = true }

[app.update]
kind = "manual"
default = "notify"

[app.remove]
keeps = []
data = ["/opt/zoraxy"]
