# Manifest of a package (docs/PLAN-packages.md). Until the packages move out of this repository the header lines of the
# script still say the same (tests/pkg.sh keeps both in step).
name = "radarr"
version = "1.3.0"
kind = "recipe"
title = "keeps your films in order: searches them, sends the download to SABnzbd, files it in the library"
title_de = "hält deine Filme in Ordnung: sucht sie, schickt den Download an SABnzbd, legt ihn in der Bibliothek ab"
requires_core = ">=9"
audience = "generic"
needs = ["docker", "share"]
uses = []
input = "none"
script = "run.sh"
runs = ["lxc", "docker"]

description = "Looks for the films you want, sends them to the download client and files them in the library."
description_de = "Sucht die Filme, die du haben willst, schickt sie an den Download-Client und sortiert sie in die Mediathek."
icon = "ph:film-strip"
category = "media"
upstream = "https://radarr.video"
app_version = "latest"

[app]
instances = "one"
autostart = true

[app.health]
check = "http"
port = 7878
path = "/"
timeout = 5

[app.backup]
mode = "instance"
dump = "sqlite-tree"

[app.routes]
default = "web"
web = { port = 7878, scheme = "http", exposure = "never-public", admin = true }

[app.update]
kind = "manual"
default = "notify"

[app.remove]
keeps = ["the media share (/media)"]
data = ["/opt/radarr"]

[app.uses]
ram_mb = 1536
ports = [7878]
